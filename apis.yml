aid: datacrunch
url: https://raw.githubusercontent.com/api-evangelist/datacrunch/refs/heads/main/apis.yml
name: DataCrunch
kind: company
description: DataCrunch is a European (Finland-based) GPU cloud offering on-demand
  and reserved NVIDIA GPU instances (H200, H100, B200, A100, L40S, V100) plus a
  serverless inference and container deployment platform. Its REST API at
  https://api.datacrunch.io/v1 uses OAuth2 client-credentials to issue Bearer
  tokens and exposes instances, instance types, availability, images, SSH keys,
  startup scripts, volumes, balance, and serverless containers, with an
  OpenAI-compatible inference endpoint for deployed models.
