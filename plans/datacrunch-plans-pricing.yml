- id: datacrunch-long-term
  name: Long-Term / Reserved Contracts
  type: subscription
  description: >-
    Discounted per-GPU-hour rates for committed long-term contracts over
    defined discount periods (e.g. monthly, multi-month), available for both
    instances and clusters.
  entries:
  - label: Reserved GPU Instance
    name: reserved_instance
    type: subscription
    metric: gpu_hours
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: discounted vs. on-demand (see long-term periods)
    userMultiplied: false
  elements:
  - name: Long-Term Periods (Instances)
  - name: Long-Term Periods (Clusters)
- id: datacrunch-serverless-containers
  name: Serverless Containers
  type: usage
  description: >-
    Autoscaling serverless container deployments billed per second of active
    compute on the selected container compute size; replicas scale to zero so
    you pay only while serving.
  entries:
  - label: Container Compute
    name: container_compute
    type: usage
    metric: compute_seconds
    limit: -1
    timeFrame: hour
    geo: global
    unit: 1
    price: per-second billing by container compute type (see container-types)
    userMultiplied: false
  elements:
  - name: Serverless Containers
  - name: OpenAI-Compatible Inference
- id: datacrunch-storage
  name: Block Storage Volumes
  type: usage
  description: >-
    Persistent NVMe/HDD block storage volumes billed per GB per month,
    independent of instance runtime.
  entries:
  - label: Volume Storage
    name: volume_storage
    type: usage
    metric: gb
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: per GB/month (see volume-types)
    userMultiplied: false
  elements:
  - name: Volumes
  - name: Volume Types
