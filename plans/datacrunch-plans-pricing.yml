specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: DataCrunch
providerId: datacrunch
created: '2026-06-21'
modified: '2026-06-21'
reconciled: true
tags:
- GPU Cloud
- Infrastructure
- Compute
- Inference
- Serverless
- Europe
- Plans
description: >-
  DataCrunch uses transparent per-GPU-per-hour, pay-as-you-go pricing for
  on-demand GPU instances, with lower long-term (reserved) rates available via
  discount-period contracts. Serverless containers are billed per second of
  active compute on a chosen container compute size with autoscaling, so you
  pay only while replicas are running. Block storage volumes are billed per GB
  per month. There are no fixed Free / Developer / Enterprise software tiers;
  customers add credit (balance) and pay for the infrastructure they consume.
notes: >-
  Representative on-demand per-GPU-hour rates from the DataCrunch pricing page
  (provider is rebranding to Verda; api.datacrunch.io remains the API host).
  Rates change frequently and reserved/long-term contracts are cheaper; verify
  current rates on the pricing page.
sources:
- https://datacrunch.io/pricing
- https://datacrunch.io/products
- https://docs.datacrunch.io/
