openapi: 3.2.0
info:
  title: Verda Cloud Public Startup Scripts API
  description: '# Introduction


    Verda Cloud API allows you to deploy, control instances & more via external code. ## Open API schema


    Download OpenAPI 3.1.0 schema here: /v1/openapi.json


    The API is a RESTful API over HTTPS, all requests & responses use JSON as the data exchange format. ## Official SDKs


    The following SDK packages maintained by Verda Cloud and use this API:


    - **Python SDK**: https://github.com/verda-cloud/sdk-python

    - **Go SDK**: https://github.com/verda-cloud/verdacloud-sdk-go

    - **Terraform** and **OpenTofu** provider: https://github.com/verda-cloud/terraform-provider-verda


    # Quick Start Guide


    We use OAuth 2.0 Client Credentials authentication scheme. You can generate credentials via the console UI https://console.verda.com for external applications to use Verda API. The credentials are used to generate Access & Refresh tokens. All requests to this API must be authenticated using the Access token, except for a few open endpoints. Access tokens have a short lifespan, and can be regenerated using the Refresh token. ## 1. Get Credentials from the Verda Cloud Dashboard


    Go to the Project page => **Keys** => **Cloud API Credentials** section and click on **Create**. These credentials will be used like a username & password for your application. Store the client secret safely - like a password. ## 2. Generate Access Token


    An Access Token is needed to be sent with any API call for authentication. The Access Token has a limited lifetime and is expired after a while as defined in `expires_in`. It is used as a bearer token


    ### To get an access token, call the token endpoint with the credentials obtained in step 1:


    ```json http

    {

    "method": "post",

    "url": "https://api.verda.com/v1/oauth2/token",

    "headers": {

    "Content-Type": "application/json"

    },

    "body": {

    "grant_type": "client_credentials",

    "client_id": "",

    "client_secret": ""

    }

    }

    ```


    A valid response would look similar to this:


    ```json

    {

    "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJoZXkiOiJ5b3UgYWN1YWxseSBjaGVja2VkIHRoaXM_In0.0RjcdKQ1NJP9gbRyXITE6LFFLwKGzeeshuubnkkfkb8",

    "token_type": "Bearer",

    "expires_in": 3600,

    "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3b3ciOiJhbmQgdGhpcyB0b28_In0.AC5gk-o-MOptUgrouEErlhr8WT3Hg_RR6px6A0I7ZEk",

    "scope": "cloud-api-v1"

    }

    ```


    `access_token` is the token value, to be used in the next step. `expires_in` is the duration in seconds until the token is expired. `refresh_token` can be used to create a new access token if expired. When an Access Token expires, create a new one using the refresh token:


    ```json http

    {

    "method": "post",

    "url": "https://api.verda.com/v1/oauth2/token",

    "headers": {

    "Content-Type": "application/json"

    },

    "body": {

    "grant_type": "refresh_token",

    "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3b3ciOiJhbmQgdGhpcyB0b28_In0.AC5gk-o-MOptUgrouEErlhr8WT3Hg_RR6px6A0I7ZEk"

    }

    }

    ```


    The response will include a new token. ## 3. Make REST API Calls


    That''s it, you are ready to use the API, don''t forget to add the Access Token to your calls:


    Let''s call the `/balance` endpoint. Add the Access Token value to the `Authorization` header, preceded by the "Bearer" string and a space:


    ```json http

    {

    "method": "get",

    "url": "https://api.verda.com/v1/balance",

    "headers": {

    "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJoZXkiOiJ5b3UgYWN1YWxseSBjaGVja2VkIHRoaXM_In0.0RjcdKQ1NJP9gbRyXITE6LFFLwKGzeeshuubnkkfkb8"

    }

    }

    ```


    # Rate Limits


    Authenticated public API requests are rate limited per project in 60 second windows. ## Limits enforced


    - **Project limit**: 500 requests per minute for all authenticated API requests made for the same project

    - **Endpoint limit**: 60 requests per minute for the same project, HTTP method, and request path combination


    The endpoint limit key includes the full request path. Route-specific endpoint policies override the regular endpoint limit for the matching request path.'
  version: v1
  contact:
    name: Verda Cloud Oy
    url: https://verda.com
    email: info@verda.com
servers:
- url: https://api.verda.com
security:
- bearer: []
tags:
- name: Startup Scripts
  description: Manage startup scripts to be run when instance are started. One project can have up to 100 startup scripts (configurable quota up to 10000).
paths:
  /v1/scripts:
    get:
      operationId: ScriptsController_getScripts
      parameters:
      - name: page
        required: false
        in: query
        description: Page number, starting from 1
        schema:
          default: '1'
          type: number
      - name: pageSize
        required: false
        in: query
        description: Number of items per page, default 10 maximum 100
        schema:
          default: '10'
          type: number
      - name: name
        required: false
        in: query
        description: Name filter. Startup scripts match by a partial name.
        schema:
          type: string
      - name: orderBy
        required: false
        in: query
        description: Field to sort by. Only `created_at` is supported.
        schema:
          default: created_at
          type: string
          enum:
          - created_at
      - name: orderDirection
        required: false
        in: query
        description: Sort direction, either `asc` or `desc`.
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Returns a list of the project's startup scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetScriptResponseDto'
      security:
      - bearer: []
      summary: Get startup scripts
      tags:
      - Startup Scripts
    post:
      operationId: ScriptsController_addScript
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddScriptDto'
      responses:
        '201':
          description: Returns the ID of the newly created script
          content:
            application/json:
              example: a2f111ae-9b82-4982-8d66-4e7faadef063
      security:
      - bearer: []
      summary: Add new startup script
      tags:
      - Startup Scripts
    delete:
      operationId: ScriptsController_deleteScripts
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteScriptsDto'
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Delete startup scripts
      tags:
      - Startup Scripts
  /v1/scripts/{scriptId}:
    get:
      operationId: ScriptsController_getScript
      parameters:
      - name: scriptId
        required: true
        in: path
        schema:
          example: 1b34e2b5-2a3a-4b14-9916-707d9ef09b18
          type: string
      responses:
        '200':
          description: Return startup script with specific ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScriptResponseDto'
      security:
      - bearer: []
      summary: Get single startup script by ID
      tags:
      - Startup Scripts
    delete:
      operationId: ScriptsController_deleteKey
      parameters:
      - name: scriptId
        required: true
        in: path
        schema:
          example: f3fe6882-9d25-43ee-b956-07205a45564d
          type: string
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Delete single startup script by ID
      tags:
      - Startup Scripts
components:
  schemas:
    GetScriptResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Script ID
          example: 84515ea1-7f4c-48da-b123-7b2112c5c738
        name:
          type: string
          description: Script name
          example: My startup script
        script:
          type: string
          description: Script content
          example: '#!/bin/bash


            echo hello world'
        created_at:
          type: string
          description: Script creation date
          example: '2026-06-12T10:30:00.000Z'
      required:
      - id
      - name
      - script
      - created_at
    AddScriptDto:
      type: object
      properties:
        name:
          type: string
          description: Script name
          example: My startup script
        script:
          type: string
          description: Script content
          example: '#!/bin/bash


            echo hello world'
      required:
      - name
      - script
    DeleteScriptsDto:
      type: object
      properties:
        scripts:
          example:
          - f537db9c-dd98-412e-9f60-34eb8e958b22
          type: array
          items:
            type: string
      required:
      - scripts
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: '[Generate the token here](#tag/authentication/POST/v1/oauth2/token). Bearer token to authenticate requests to the public API. You can generate a token by calling the `/v1/oauth2/token` endpoint.'
