      - mount_path
      - secret_name
    ContainerRegistrySettingsPublicApiDto:
      type: object
      properties:
        is_private:
          type: boolean
          description: Privacy mode of the container registry - is it public or private
          example: true
        credentials:
          description: Credential details for the registry if it is private. Required if privacy mode is private
          allOf:
          - $ref: '#/components/schemas/ContainerRegistryCredentials'
      required:
      - is_private
      - credentials
    ReplicasPublicApiDto:
      type: object
