      - Serverless Containers
  /v1/container-deployment-templates:
    get:
      operationId: ContainerDeploymentTemplatesPublicApiController_listTemplates
      parameters: []
      responses:
        '200':
          description: Curated models with a ready serving configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerDeploymentTemplatePublicApiDto'
        '401':
          description: Unauthorized
