      - env
    GetFilesetSecretsPublicApiResponseDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the secret
          example: api-token
        created_at:
          type: string
          description: The date when the secret was created
          example: '2020-08-12T12:00:00.000Z'
        secret_type:
          type: string
          description: Type of the secret
          example: file-secret
          enum:
          - file-secret
        file_names:
          description: Names of the files contained in the fileset secret
          example:
          - tokens.txt
          - config.json
