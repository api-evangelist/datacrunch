openapi: 3.2.0
info:
  title: Verda Cloud Public Serverless Containers API
  description: '# Introduction


    Verda Cloud API allows you to deploy, control instances & more via external code. ## Open API schema


    Download OpenAPI 3.1.0 schema here: /v1/openapi.json


    The API is a RESTful API over HTTPS, all requests & responses use JSON as the data exchange format. ## Official SDKs


    The following SDK packages maintained by Verda Cloud and use this API:


    - **Python SDK**: https://github.com/verda-cloud/sdk-python

    - **Go SDK**: https://github.com/verda-cloud/verdacloud-sdk-go

    - **Terraform** and **OpenTofu** provider: https://github.com/verda-cloud/terraform-provider-verda


    # Quick Start Guide


    We use OAuth 2.0 Client Credentials authentication scheme. You can generate credentials via the console UI https://console.verda.com for external applications to use Verda API. The credentials are used to generate Access & Refresh tokens. All requests to this API must be authenticated using the Access token, except for a few open endpoints. Access tokens have a short lifespan, and can be regenerated using the Refresh token. ## 1. Get Credentials from the Verda Cloud Dashboard


    Go to the Project page => **Keys** => **Cloud API Credentials** section and click on **Create**. These credentials will be used like a username & password for your application. Store the client secret safely - like a password. ## 2. Generate Access Token


    An Access Token is needed to be sent with any API call for authentication. The Access Token has a limited lifetime and is expired after a while as defined in `expires_in`. It is used as a bearer token


    ### To get an access token, call the token endpoint with the credentials obtained in step 1:


    ```json http

    {

    "method": "post",

    "url": "https://api.verda.com/v1/oauth2/token",

    "headers": {

    "Content-Type": "application/json"

    },

    "body": {

    "grant_type": "client_credentials",

    "client_id": "",

    "client_secret": ""

    }

    }

    ```


    A valid response would look similar to this:


    ```json

    {

    "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJoZXkiOiJ5b3UgYWN1YWxseSBjaGVja2VkIHRoaXM_In0.0RjcdKQ1NJP9gbRyXITE6LFFLwKGzeeshuubnkkfkb8",

    "token_type": "Bearer",

    "expires_in": 3600,

    "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3b3ciOiJhbmQgdGhpcyB0b28_In0.AC5gk-o-MOptUgrouEErlhr8WT3Hg_RR6px6A0I7ZEk",

    "scope": "cloud-api-v1"

    }

    ```


    `access_token` is the token value, to be used in the next step. `expires_in` is the duration in seconds until the token is expired. `refresh_token` can be used to create a new access token if expired. When an Access Token expires, create a new one using the refresh token:


    ```json http

    {

    "method": "post",

    "url": "https://api.verda.com/v1/oauth2/token",

    "headers": {

    "Content-Type": "application/json"

    },

    "body": {

    "grant_type": "refresh_token",

    "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3b3ciOiJhbmQgdGhpcyB0b28_In0.AC5gk-o-MOptUgrouEErlhr8WT3Hg_RR6px6A0I7ZEk"

    }

    }

    ```


    The response will include a new token. ## 3. Make REST API Calls


    That''s it, you are ready to use the API, don''t forget to add the Access Token to your calls:


    Let''s call the `/balance` endpoint. Add the Access Token value to the `Authorization` header, preceded by the "Bearer" string and a space:


    ```json http

    {

    "method": "get",

    "url": "https://api.verda.com/v1/balance",

    "headers": {

    "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJoZXkiOiJ5b3UgYWN1YWxseSBjaGVja2VkIHRoaXM_In0.0RjcdKQ1NJP9gbRyXITE6LFFLwKGzeeshuubnkkfkb8"

    }

    }

    ```


    # Rate Limits


    Authenticated public API requests are rate limited per project in 60 second windows. ## Limits enforced


    - **Project limit**: 500 requests per minute for all authenticated API requests made for the same project

    - **Endpoint limit**: 60 requests per minute for the same project, HTTP method, and request path combination


    The endpoint limit key includes the full request path. Route-specific endpoint policies override the regular endpoint limit for the matching request path.'
  version: v1
  contact:
    name: Verda Cloud Oy
    url: https://verda.com
    email: info@verda.com
servers:
- url: https://api.verda.com
security:
- bearer: []
tags:
- name: Serverless Containers
paths:
  /v1/container-deployments/{deployment_name}/logs:
    get:
      description: Fetch log lines from the replicas of a deployment.
      operationId: DeploymentLogsPublicApiController_getLogs
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      - name: container_name
        required: false
        in: query
        description: Filter by container name. If omitted, the endpoint returns the logs of all user containers of the deployment. A name that is not a container of this deployment returns no log lines.
        schema:
          example: app
          type: string
      - name: pod
        required: false
        in: query
        description: Filter by replica (pod) name. Repeat the parameter for multiple values.
        schema:
          example: my-deployment-6f9c8b7d5-x2abc
          type: array
          items:
            type: string
      - name: search_text
        required: false
        in: query
        description: Filter log lines containing the given text.
        schema:
          example: error
          type: string
      - name: since
        required: false
        in: query
        description: Relative time window, for example 30s, 15m, 2h, 3d. Defaults to 15m. The time range cannot exceed 7 days.
        schema:
          example: 2h
          type: string
      - name: start
        required: false
        in: query
        description: Start of the time range. ISO 8601 date or epoch time (s, ms, us, or ns). Overrides since. The time range cannot exceed 7 days.
        schema:
          example: '2026-06-01T12:00:00Z'
          type: string
      - name: end
        required: false
        in: query
        description: End of the time range. ISO 8601 date, epoch time, or "now". Defaults to now.
        schema:
          example: now
          type: string
      - name: order
        required: false
        in: query
        description: Order of the returned log lines by timestamp. The endpoint sorts the time range before it applies limit, so desc returns the newest lines of the range and asc returns the oldest. Defaults to desc.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: limit
        required: false
        in: query
        description: Maximum number of log lines to return. Narrow the time range or use the order parameter to reach lines outside the returned page.
        schema:
          minimum: 1
          maximum: 1000
          default: 50
          type: number
      responses:
        '200':
          description: List of log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentLogEntryPublicApiResponseDto'
        '401':
          description: Unauthorized
        '404':
          description: Deployment not found
      summary: Get deployment replica logs
      tags:
      - Serverless Containers
  /v1/container-deployments:
    get:
      operationId: PublicApiController_getDeploymentsList
      parameters: []
      responses:
        '200':
          description: Fetch a list of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Get all deployments
      tags:
      - Serverless Containers
    post:
      operationId: PublicApiController_createNewDeployment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentPublicApiDto'
      responses:
        '201':
          description: Returns the created deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Create new deployment
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}:
    get:
      operationId: PublicApiController_getDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '200':
          description: Fetch a deployment by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Get deployment by name
      tags:
      - Serverless Containers
    patch:
      operationId: PublicApiController_updateDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDeploymentPublicApiDto'
      responses:
        '200':
          description: Returns the updated deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Update deployment
      tags:
      - Serverless Containers
    delete:
      operationId: PublicApiController_deleteDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      - name: timeout
        required: false
        in: query
        description: Maximum time to wait for deployment deletion in milliseconds. Set to 0 to skip waiting.
        schema:
          minimum: 0
          maximum: 300000
          default: 60000
          example: 60000
          type: number
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
      summary: Delete deployment
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/status:
    get:
      operationId: PublicApiController_getReplicasStatusByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeploymentStatusResponseDto'
        '401':
          description: Unauthorized
      summary: Get deployment status
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/restart:
    post:
      operationId: PublicApiController_restartDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
      summary: Restart deployment
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/scaling:
    get:
      operationId: PublicApiController_getDeploymentScalingOptionsByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '200':
          description: Scaling options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScalingOptionsPublicApiDto'
        '401':
          description: Unauthorized
      summary: Get deployment scaling options by deployment name
      tags:
      - Serverless Containers
    patch:
      operationId: PublicApiController_updateDeploymentScalingOptionsByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchScalingOptionsPublicApiDto'
      responses:
        '200':
          description: Returns the updated scaling options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScalingOptionsPublicApiDto'
        '401':
          description: Unauthorized
      summary: Update deployment scaling options
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/replicas:
    get:
      operationId: PublicApiController_getDeploymentReplicasByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '200':
          description: List of replicas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicasPublicApiDto'
        '401':
          description: Unauthorized
      summary: Get deployment replicas by deployment name
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/purge-queue:
    post:
      operationId: PublicApiController_purgeQueue
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
      summary: Purge deployment queue
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/pause:
    post:
      operationId: PublicApiController_pauseDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
      summary: Pause deployment
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/resume:
    post:
      operationId: PublicApiController_resumeDeploymentByName
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
      summary: Resume deployment
      tags:
      - Serverless Containers
  /v1/container-deployments/{deployment_name}/environment-variables:
    get:
      operationId: PublicApiController_getDeploymentEnvironmentVariables
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      responses:
        '200':
          description: Returns the environment variables for all containers of the deployment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetDeploymentEnvVariablesPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Get deployment environment variables
      tags:
      - Serverless Containers
    post:
      operationId: PublicApiController_addEnvironmentVariablesToContainer
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrPatchEnvironmentVariablesDto'
      responses:
        '200':
          description: Returns the environment variables for the container
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetDeploymentEnvVariablesPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Add environment variables to a container
      tags:
      - Serverless Containers
    patch:
      operationId: PublicApiController_updateEnvironmentVariablesOfContainer
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrPatchEnvironmentVariablesDto'
      responses:
        '200':
          description: Returns the updated environment variables for the container
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetDeploymentEnvVariablesPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Update environment variables of a container.
      tags:
      - Serverless Containers
    delete:
      operationId: PublicApiController_deleteEnvironmentVariablesOfContainer
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentVariablesPublicApiDto'
      responses:
        '200':
          description: Returns the remaining environment variables for the container
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetDeploymentEnvVariablesPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Delete environment variables of a container
      tags:
      - Serverless Containers
  /v1/serverless-compute-resources:
    get:
      operationId: PublicApiController_getComputeAndAvailability
      parameters: []
      responses:
        '200':
          description: A list of compute resources and their availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetComputeResourcesPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Get compute resource types and availability
      tags:
      - Serverless Containers
  /v1/secrets:
    get:
      operationId: PublicApiController_getSecrets
      parameters: []
      responses:
        '200':
          description: A list of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetSecretsPublicApiResponseDto'
        '401':
          description: Unauthorized
      summary: Get secrets
      tags:
      - Serverless Containers
    post:
      operationId: PublicApiController_addSecret
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretPublicApiDto'
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
      summary: Create new secret
      tags:
      - Serverless Containers
  /v1/secrets/{secret_name}:
    delete:
      description: Will error if the secret is used in a deployment
      operationId: PublicApiController_deleteSecret
      parameters:
      - name: secret_name
        required: true
        in: path
        schema:
          type: string
      - name: force
        required: false
        in: query
        description: Force delete the secret, even if it is used in deployments. Dangerous! may cause deployments to fail
        schema:
          example: true
          type: boolean
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
      summary: Delete secret
      tags:
      - Serverless Containers
  /v1/file-secrets:
    get:
