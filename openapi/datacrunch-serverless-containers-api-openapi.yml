      - name
      - value
    SharedVolumeMountDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the volume
          examples:
          - shared
          enum:
          - shared
        mount_path:
          type: string
          description: Path in the container where the volume will be mounted.
          example: /shared
        volume_id:
          type: string
          description: ID of the shared volume to be mounted
          example: b94cf73c-33ee-472f-8aaa-23590dfcf570
      required:
      - type
      - mount_path
      - volume_id
    SecretVolumeMountDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the volume
          examples:
          - secret
          enum:
          - secret
        mount_path:
          type: string
          description: Path in the container where the volume will be mounted.
          example: /secret-files
        secret_name:
          type: string
          description: Name of the fileset secret to be mounted
          example: my-secret
