    MemoryVolumeMountDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the volume
          examples:
          - memory
          enum:
          - memory
        mount_path:
          type: string
          description: Path in the container where the volume will be mounted. This setting is fixed for now and cannot be changed
          example: /dev/shm
          default: /dev/shm
        size_in_mb:
          type: number
          description: Size of memory volume in MiB
          enum:
          - 64
          - 128
          - 256
          - 512
          - 1024
          - 2048
          - 4096
          - 8192
          - 16384
          - 32768
          examples:
          - 64
          - 128
          - 256
          - 512
          - 1024
          - 2048
          - 4096
          - 8192
          - 16384
          - 32768
      required:
      - type
      - mount_path
      - size_in_mb
    ContainerDeploymentTemplateFeaturePublicApiDto:
      type: object
      properties:
        id:
          type: string
          description: Feature identifier, passed in `features` when deploying
          example: tool_calling
        name:
          type: string
          description: Human-readable name
          example: Tool calling
        description:
          type: string
          description: What the feature enables
          example: Enables tool calling with the Qwen chat template
        is_default:
          type: boolean
          description: Whether the feature is on when no features are given
          example: true
        conflicts_with:
          description: Feature ids that cannot be enabled together with this one
          example: []
          type: array
          items:
            type: string
      required:
      - id
      - name
      - is_default
      - conflicts_with
    CreateFilesetSecretPublicApiDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the files secret
          example: secret-files
        files:
          description: List of files to store in the secret
          type: array
          items:
            $ref: '#/components/schemas/SecretFilePublicApiDto'
      required:
      - name
      - files
    ContainerPublicApiDto:
      type: object
      properties:
        image:
          type: string
          description: Image to be deployed in the container
          example: registry-1.docker.io/chentex/random-logger:v1.0.1
        should_use_cached_image:
          type: boolean
          description: Pull the image through the platform image cache. Applies only to public Docker Hub images. Has no effect for images from other registries, or when registry credentials are set. When the cache is used, registry credentials are not needed to avoid Docker Hub rate limits, because the cache pulls with a platform account. Without the cache, this does not apply.
          example: true
          default: true
        exposed_port:
          type: number
          description: Port to be exposed by the container
          example: 8080
        healthcheck:
          description: Healthcheck settings for the container
          allOf:
          - $ref: '#/components/schemas/HealthcheckSettings'
        entrypoint_overrides:
          description: Entrypoint overrides settings for the container
          allOf:
          - $ref: '#/components/schemas/EntrypointOverridesSettings'
        env:
          description: Environment variables for the container
          type: array
          items:
            $ref: '#/components/schemas/EnvVarPublicApi'
        volume_mounts:
          type: array
          description: Volume mounts for the container
          items:
            oneOf:
            - $ref: '#/components/schemas/ScratchVolumeMountDto'
              description: Scratch volume mount
            - $ref: '#/components/schemas/SecretVolumeMountDto'
              description: Secret volume mount
            - $ref: '#/components/schemas/SharedVolumeMountDto'
              description: Shared filesystem volume mount
            - $ref: '#/components/schemas/MemoryVolumeMountDto'
              description: Memory volume mount
      required:
      - image
      - exposed_port
    CreateDeploymentPublicApiDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the deployment. Immutable after creation
          example: llm-inference
        container_registry_settings:
          description: Container registry settings. Private registries require saving the credentials via datacrunch cloud UI
          allOf:
          - $ref: '#/components/schemas/ContainerRegistrySettingsPublicApiDto'
        containers:
          description: Containers to be deployed
          type: array
          items:
            $ref: '#/components/schemas/ContainerPublicApiDto'
        compute:
          description: Compute settings for the deployment
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
        scaling:
          description: Scaling settings for the deployment
          allOf:
          - $ref: '#/components/schemas/CreateScalingOptionsPublicApiDto'
        is_spot:
          type: boolean
          description: Is the deployment a spot deployment
          example: false
          default: false
        is_verda_io:
          type: boolean
          description: Declare the workload is a verda-io image (built by `verda-io build`).
          example: false
          default: false
      required:
      - name
      - container_registry_settings
      - containers
      - compute
      - scaling
    EnvVarPublicApi:
      type: object
      properties:
        name:
          type: string
          description: Name of the environment variable
