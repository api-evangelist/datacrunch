  /v1/container-deployments/{deployment_name}/system-logs:
    get:
      description: Fetch deployment system logs.
      operationId: DeploymentSystemLogsPublicApiController_getLogs
      parameters:
      - name: deployment_name
        required: true
        in: path
        description: Name of the deployment
        schema:
          maxLength: 63
          example: my-deployment
          type: string
      - name: reason
        required: false
        in: query
        description: Exact display reasons. An unknown reason returns no events.
        schema:
          type: array
          items:
            type: string
      - name: involved_object
        required: false
        in: query
        description: Exact involved object names.
        schema:
          type: array
          items:
            type: string
      - name: search_text
        required: false
        in: query
        description: Case-insensitive substring of the clean message, display reason and involved object. Whitespace is trimmed; blank search imposes no restriction.
        schema:
          type: string
      - name: since
        required: false
        in: query
        description: Relative window such as 15m or 1d. Maximum range is 7 days. Blank time parameters use their defaults.
        schema:
          default: 1d
          type: string
      - name: start
        required: false
        in: query
        description: ISO 8601 or epoch time (s, ms, us or ns). Overrides since. Maximum range is 7 days.
        schema:
          type: string
      - name: end
        required: false
        in: query
        description: ISO 8601, epoch time (s, ms, us or ns), or now.
        schema:
          default: now
      - name: order
        required: false
        in: query
        description: Timestamp order of the returned entries. Ascending does not reach events the request did not read.
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      - name: limit
        required: false
        in: query
        description: 'Maximum number of entries to return. There is no paging: change the time range or the filters to reach other events.'
        schema:
          minimum: 1
          maximum: 1000
          default: 50
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemLogEntryPublicApiResponseDto'
        '400':
          description: Invalid query or deployment name
        '401':
          description: Unauthorized
        '403':
          description: Project access denied
        '404':
          description: Deployment not found
      summary: Get deployment system logs
      tags:
      - Serverless Containers
components:
  schemas:
    HealthcheckSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Is healthcheck enabled for the container. It it used to check if the container is ready to accept traffic
          example: true
        port:
          type: number
          description: Port to be used for healthcheck
          example: 8081
        path:
          type: string
          description: Path to be used for healthcheck
          example: /health
      required:
      - enabled
      - port
      - path
    SystemLogEntryPublicApiResponseDto:
      type: object
      properties:
        timestamp:
          type: string
          example: '2026-06-01T12:00:00.123456789Z'
          description: Latest observed timestamp of the group, RFC3339 with nanosecond precision.
        reason:
          type: string
          example: SchedulingFailed
          description: Display reason of the event.
        message:
          type: string
          example: Replica is waiting for its storage volume to be provisioned
          description: Event message without an observation-count suffix.
        involved_object:
          type: string
          example: my-deployment-6f9c8b7d5-x2abc
          description: Workload or child object the event concerns; not necessarily a replica.
        count:
          type: number
          minimum: 1
          example: 3
          description: Collected records grouped into this entry, not a Kubernetes occurrence count. May be partial at the raw scan cap.
      required:
      - timestamp
      - reason
      - message
      - involved_object
      - count
    DeploymentPublicApiResponseDto:
      type: object
      properties:
        name:
          type: string
          description: Deployment name
          example: flux
        containers:
          description: Containers in the deployment
          type: array
          items:
            $ref: '#/components/schemas/ContainerPublicApiResponseDto'
        endpoint_base_url:
          type: string
          description: The base URL of the endpoint
          example: https://containers.datacrunch.io/flux
        created_at:
          type: string
          example: '2021-08-31T12:00:00.000Z'
        compute:
          description: Compute resource details
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
        container_registry_settings:
          description: Container registry settings
          allOf:
          - $ref: '#/components/schemas/ContainerRegistrySettingsPublicApiDto'
        is_spot:
          type: boolean
          example: false
      required:
      - name
      - containers
      - endpoint_base_url
      - created_at
      - compute
      - container_registry_settings
      - is_spot
    ContainerDeploymentTemplateDetailPublicApiDto:
      type: object
      properties:
        id:
          type: string
          description: Stable, URL-safe template identifier used in template paths
          example: qwen3-5-9b
        name:
          type: string
          description: Human-readable name of the model
          example: Qwen3.5 9B
        description:
          type: string
          description: Description of the model
          example: Dense multimodal model with gated delta networks hybrid attention and 262K context. Single-GPU serving.
        provider:
          type: string
          description: Provider of the model
          example: Qwen
        engine:
          type: string
          description: Serving engine used by the template
          example: vllm
        model_repository:
          type: string
          description: Hugging Face repository the default variant loads
          example: Qwen/Qwen3.5-9B
        parameters:
          type: string
          description: Parameter count of the model (display string)
          example: 9B
        context_length:
          type: number
          description: Maximum context length in tokens
          example: 262144
        input_modalities:
          description: Accepted input modalities
          example:
          - text
          - image
          type: array
          items:
            type: string
        output_modalities:
          description: Produced output modalities
          example:
          - text
          type: array
          items:
            type: string
        tasks:
          description: Coarse task labels
          example:
          - text
          - multimodal
          type: array
          items:
            type: string
        requires_hugging_face_token:
          type: boolean
          description: Whether a Hugging Face token is required to deploy the model (gated checkpoint)
          example: false
        min_vram_gb:
          type: number
          description: Minimum total GPU memory in GB for the default variant
          example: 22
        recommended_compute:
          description: Smallest compute configuration currently offered that fits the default variant. Null when nothing offered fits
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
        revision:
          type: object
          description: Pinned Hugging Face revision of the default repository. Null tracks the main branch
          example: c202236235762e1c871ad0ccb60c8ee5ba337b9a
          nullable: true
        variants:
          description: Selectable weight variants. The first one is the default
          type: array
          items:
            $ref: '#/components/schemas/ContainerDeploymentTemplateVariantPublicApiDto'
        features:
          description: Independently selectable serving features
          type: array
          items:
            $ref: '#/components/schemas/ContainerDeploymentTemplateFeaturePublicApiDto'
      required:
      - id
      - name
      - description
      - provider
      - engine
      - model_repository
      - parameters
      - context_length
      - input_modalities
      - output_modalities
      - tasks
      - requires_hugging_face_token
      - min_vram_gb
      - recommended_compute
      - revision
      - variants
      - features
    ScalingTriggers:
      type: object
      properties:
        queue_load:
          description: Scaling trigger based on queue load
          allOf:
          - $ref: '#/components/schemas/QueueLoadScalingTrigger'
        cpu_utilization:
          description: Scaling trigger based on CPU utilization by percentage
          allOf:
          - $ref: '#/components/schemas/UtilizationScalingTrigger'
        gpu_utilization:
          description: Scaling trigger based on GPU utilization by percentage
          allOf:
          - $ref: '#/components/schemas/UtilizationScalingTrigger'
      required:
      - queue_load
      - cpu_utilization
      - gpu_utilization
    ContainerRegistryCredentials:
      type: object
      properties:
        name:
          type: string
          description: Credential name of the secret containing the credentials
          example: dockerhub-credentials
      required:
      - name
    GetDeploymentEnvVariablesPublicApiResponseDto:
      type: object
      properties:
        container_name:
          type: string
          description: Container name
          example: flux-0
        env:
          description: Environment variables for the container
          type: array
          items:
            $ref: '#/components/schemas/EnvVarPublicApi'
      required:
      - container_name
      - env
    ScalingPolicy:
      type: object
      properties:
        delay_seconds:
          type: number
          description: Cooldown period in seconds before the deployment scales up or down
          example: 300
      required:
      - delay_seconds
    QueueLoadScalingTrigger:
      type: object
      properties:
        threshold:
          type: number
          description: Threshold value for queue load. Queue item to replica ratio
          example: 2
      required:
      - threshold
    EntrypointOverridesSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Is the default docker start command and arguments overridden
          example: true
        entrypoint:
          description: Entrypoint command to start the container
          example:
          - python3
          - main.py
          type: array
          items:
            type: string
        cmd:
          description: Arguments to the entrypoint command
          example:
          - --port
          - '8080'
          type: array
          items:
            type: string
      required:
      - enabled
    CreateScalingOptionsPublicApiDto:
      type: object
      properties:
        min_replica_count:
          type: number
          description: Minimum number of replicas
        max_replica_count:
          type: number
          description: Maximum number of replicas
        scale_down_policy:
          description: Policy for scaling down replicas
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        scale_up_policy:
          description: Policy for scaling up replicas
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        queue_message_ttl_seconds:
          type: number
          description: Duration in seconds after which messages in the queue will be dropped
        concurrent_requests_per_replica:
          type: number
          description: Number of requests each replica can process concurrently. Set this number higher for LLM endpoints, and to 1 for image generation endpoints.
        scaling_triggers:
          description: Triggers for scaling up and down
          allOf:
          - $ref: '#/components/schemas/ScalingTriggers'
      required:
      - min_replica_count
      - max_replica_count
      - scale_down_policy
      - scale_up_policy
      - queue_message_ttl_seconds
      - concurrent_requests_per_replica
      - scaling_triggers
    DeploymentLogEntryPublicApiResponseDto:
      type: object
      properties:
        timestamp:
          type: string
          description: Log line timestamp, ISO 8601 with nanosecond precision.
          example: '2026-06-01T12:00:00.123456789Z'
        container_name:
          type: string
          description: Name of the container that produced the log line.
          example: app
        replica:
          type: string
          description: Name of the replica (pod) that produced the log line.
          example: my-deployment-6f9c8b7d5-x2abc
        message:
          type: string
          description: The log line content.
          example: GET /healthz 200
      required:
      - timestamp
      - container_name
      - replica
      - message
    UtilizationScalingTrigger:
      type: object
      properties:
        enabled:
          type: boolean
          description: Is the trigger enabled
          example: true
        threshold:
          type: number
          description: Threshold value for utilization, in percent
          example: 80
      required:
      - enabled
      - threshold
    GetDeploymentStatusResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the deployment
          example: healthy
          enum:
          - initializing
          - healthy
          - degraded
          - unhealthy
          - paused
          - quota_reached
          - image_pulling
          - updating
          - terminating
      required:
      - status
    ScalingOptionsPublicApiDto:
      type: object
      properties:
        min_replica_count:
          type: number
          description: Minimum number of replicas
          example: 1
        max_replica_count:
          type: number
          description: Maximum number of replicas
          example: 50
        scale_down_policy:
          description: Policy for scaling down replicas
          example:
            delay_seconds: 300
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        scale_up_policy:
          description: Policy for scaling up replicas
          example:
            delay_seconds: 300
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        queue_message_ttl_seconds:
          type: number
          description: Duration in seconds after which messages in the queue will be dropped
          example: 500
        concurrent_requests_per_replica:
          type: number
          description: Number of requests each replica can process concurrently.
          example: 1
        scaling_triggers:
          description: Triggers for scaling up and down
          allOf:
          - $ref: '#/components/schemas/ScalingTriggers'
      required:
      - min_replica_count
      - max_replica_count
      - scale_down_policy
      - scale_up_policy
      - queue_message_ttl_seconds
      - concurrent_requests_per_replica
      - scaling_triggers
    DeleteEnvironmentVariablesPublicApiDto:
      type: object
      properties:
        container_name:
          type: string
          description: Container name
          example: flux-0
        env:
          description: List of environment variable names to delete
          example:
          - MY_ENV_VAR
          - MY_OTHER_ENV_VAR
          type: array
          items:
            type: string
      required:
      - container_name
      - env
    GetComputeResourcesPublicApiResponseDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the compute resource
          example: H100
        size:
          type: number
          description: Number of compute units (e.g. 4 GPUs). Default is 1
          examples:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 32
          default: 1
        is_available:
          type: boolean
          description: Is the compute resource available
          example: true
      required:
      - name
      - size
      - is_available
    ContainerDeploymentTemplateVariantPublicApiDto:
      type: object
      properties:
        id:
          type: string
          description: Variant identifier, passed as `variant` when deploying
          example: fp8
        precision:
          type: string
          description: Weight precision
          example: fp8
        model_repository:
          type: string
          description: Hugging Face repository this variant loads
          example: Qwen/Qwen3.5-9B-FP8
        min_vram_gb:
          type: number
          description: Minimum total GPU memory in GB
          example: 12
        is_default:
          type: boolean
          description: Whether this variant is used when no variant is given
          example: true
        description:
          type: string
          description: What sets this variant apart
          example: FP8 weights and KV cache, fits a single 16 GB GPU
        recommended_compute:
          description: Smallest compute configuration currently offered that fits this variant. Null when nothing offered fits
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
      required:
      - id
      - precision
      - model_repository
      - min_vram_gb
      - is_default
      - recommended_compute
    GetRegistryCredentialsPublicApiResponseDto:
      type: object
      properties:
        name:
          type: string
          description: The name given to the registry credential
          example: dockerhub-credentials
        created_at:
          type: string
          description: The date when the registry credential was created
          example: '2020-08-12T12:00:00.000Z'
      required:
      - name
      - created_at
    ContainerPublicApiResponseDto:
      type: object
      properties:
        should_use_cached_image:
          type: boolean
          description: Pull the image through the platform image cache. Applies only to public Docker Hub images. Has no effect for images from other registries, or when registry credentials are set. When the cache is used, registry credentials are not needed to avoid Docker Hub rate limits, because the cache pulls with a platform account. Without the cache, this does not apply.
          example: true
          default: true
        exposed_port:
          type: number
          description: Port to be exposed by the container
          example: 8080
        healthcheck:
          description: Healthcheck settings for the container
          allOf:
          - $ref: '#/components/schemas/HealthcheckSettings'
        entrypoint_overrides:
          description: Entrypoint overrides settings for the container
          allOf:
          - $ref: '#/components/schemas/EntrypointOverridesSettings'
        env:
          description: Environment variables for the container
          type: array
          items:
            $ref: '#/components/schemas/EnvVarPublicApi'
        volume_mounts:
          type: array
          description: Volume mounts for the container
          items:
            oneOf:
            - $ref: '#/components/schemas/ScratchVolumeMountDto'
              description: Scratch volume mount
            - $ref: '#/components/schemas/SecretVolumeMountDto'
              description: Secret volume mount
            - $ref: '#/components/schemas/SharedVolumeMountDto'
              description: Shared filesystem volume mount
            - $ref: '#/components/schemas/MemoryVolumeMountDto'
              description: Memory volume mount
        image:
          type: object
          description: Image details
          example:
            image: registry-1.docker.io/chentex/random-logger:v1.0.1
            last_updated_at: '2026-10-19T07:54:29.900Z'
        name:
          type: string
          description: Container name
          example: random-logger-0
      required:
      - exposed_port
      - image
      - name
    PatchDeploymentPublicApiDto:
      type: object
      properties:
        container_registry_settings:
          description: Container registry settings. Private registries require saving the credentials via datacrunch cloud UI
          example:
            is_private: true
            credentials:
              name: dockerhub-credentials
          allOf:
          - $ref: '#/components/schemas/ContainerRegistrySettingsPublicApiDto'
        containers:
          description: Containers properties to be updated
          type: array
          items:
            $ref: '#/components/schemas/PatchContainerPublicApiDto'
        compute:
          description: Change compute settings for the deployment
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
        is_spot:
          type: boolean
          description: Spot instance settings for the deployment
          example: false
    PatchScalingTriggers:
      type: object
      properties:
        queue_load:
          description: Scaling trigger based on queue load
          allOf:
          - $ref: '#/components/schemas/QueueLoadScalingTrigger'
        cpu_utilization:
          description: Scaling trigger based on CPU utilization by percentage
          allOf:
          - $ref: '#/components/schemas/UtilizationScalingTrigger'
        gpu_utilization:
          description: Scaling trigger based on GPU utilization by percentage
          allOf:
          - $ref: '#/components/schemas/UtilizationScalingTrigger'
    DeployContainerDeploymentTemplatePublicApiDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the deployment. Immutable after creation
          example: qwen3-5-9b
        variant:
          type: string
          description: Variant id from the template detail. Defaults to the first variant
          example: fp8
        features:
          description: Feature ids to enable. Defaults to the features marked is_default
          example:
          - tool_calling
          - reasoning
          type: array
          items:
            type: string
        compute:
          description: Compute to deploy on. Defaults to the smallest offered configuration that fits the variant
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
        hf_token_secret_name:
          type: string
          description: Name of an existing secret (POST /secrets) holding a Hugging Face token. Required for gated models
          example: hf-token
        shm_size_mb:
          type: number
          description: 'Size of the /dev/shm memory volume in MiB. Defaults to a size based on the GPU count (1 GPU: 1024, 2: 4096, 4: 8192, 8: 16384) or the template default'
          enum:
          - 64
          - 128
          - 256
          - 512
          - 1024
          - 2048
          - 4096
          - 8192
          - 16384
          - 32768
          example: 8192
        scaling:
          description: Scaling options. Omitted fields use the platform defaults
          allOf:
          - $ref: '#/components/schemas/PatchScalingOptionsPublicApiDto'
      required:
      - name
    AutoupdateSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Is autoupdate enabled for the container
          example: true
        mode:
          type: string
          description: Autoupdate mode for the container
          example: latest
          enum:
          - latest
          - semantic
        tag_filter:
          type: string
          description: Tag filter for the autoupdate. Supports regex
          example: ^v?1.0.d+$
      required:
      - enabled
      - mode
    CreateRegistryCredentialsPublicApiDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the registry credential
          example: dockerhub-credentials
        type:
          type: string
          description: Type of the container registry
          enum:
          - verda
          - gcr
          - dockerhub
          - ghcr
          - aws-ecr
          - scaleway
          - custom
          example: dockerhub
        username:
          type: string
          description: Username for the Docker Hub registry, if selected type is DockerHub
          example: JADES-GS-z14-0
        access_token:
          type: string
          description: Access token for the registry, if selected type is DockerHub or Github
          example: REDACTED_DOCKER_PAT
        service_account_key:
          type: string
          description: Service account key for the Google Cloud Registry (Google Artifact Registry), if selected type is GCR
          example: "{\n  \"type\": \"service_account\",\n  \"project_id\": \"clever-overview-111111-b1\",\n  \"private_key_id\": \"5434a8e7108656c582b4567890b77e9eaa7501c5\",\n  \"private_key\": \"REDACTED_PRIVATE_KEY_EXAMPLE\n\",\n  \"client_email\": \"test-account@clever-overview-111111-b1.iam.gserviceaccount.com\",\n  \"client_id\": \"107932416123456636077\",\n  \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\",\n  \"token_uri\": \"https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\": \"https://www.googleapis.com/oauth2/v1/certs\",\n  \"client_x509_cert_url\": \"https://www.googleapis.com/robot/v1/metadata/x509/test-account%40clever-overview-111111-b1.iam.gserviceaccount.com\",\n  \"universe_domain\": \"googleapis.com\"\n}"
        docker_config_json:
          type: string
          description: Docker config JSON for the custom registry, if selected type is Custom
          example: "{\n  \"auths\": {\n    \"ghcr.io\": {\n      \"auth\": \"dXNlcjpwYXNzd29yZA==\"\n    }\n  }\n}"
        access_key_id:
          type: string
          description: Access key ID for the AWS Elastic Container Registry, if selected type is AWSECR
          example: AKIAEXAMPLE123456
        secret_access_key:
          type: string
          description: Secret access key for the AWS Elastic Container Registry, if selected type is AWSECR
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        region:
          type: string
          description: Region for the AWS Elastic Container Registry, if selected type is AWSECR
          example: eu-north-1
        ecr_repo:
          type: string
          description: Repository for the AWS Elastic Container Registry, if selected type is AWSECR
          example: 887841266746.dkr.ecr.eu-north-1.amazonaws.com
        scaleway_domain:
          type: string
          description: Region-specific domain, if selected type is Scaleway
          example: rg.nl-ams.scw.cloud
        scaleway_uuid:
          type: string
          description: API secret key, if selected type is Scaleway
          example: ea55b6d2-c789-4b31-88b1-f77ba6ff7cd6
      required:
      - name
      - type
    PatchContainerPublicApiDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the container to update
          example: random-logger-0
        image:
          type: string
          description: Image to be deployed in the container
          example: registry-1.docker.io/chentex/random-logger:v1.0.1
        should_use_cached_image:
          type: boolean
          description: Pull the image through the platform image cache. Applies only to public Docker Hub images. Has no effect for images from other registries, or when registry credentials are set. When the cache is used, registry credentials are not needed to avoid Docker Hub rate limits, because the cache pulls with a platform account. Without the cache, this does not apply. If `image` is not sent, the setting applies to the current image. If `image` is sent without this field, the current setting is kept.
          example: true
        exposed_port:
          type: number
          description: Port to be exposed by the container
          example: 8080
        healthcheck:
          description: Healthcheck settings for the container
          allOf:
          - $ref: '#/components/schemas/HealthcheckSettings'
        entrypoint_overrides:
          description: Entrypoint overrides settings for the container
          allOf:
          - $ref: '#/components/schemas/EntrypointOverridesSettings'
        env:
          description: Environment variables for the container
          type: array
          items:
            $ref: '#/components/schemas/EnvVarPublicApi'
        autoupdate:
          description: Container image autoupdate settings for the container
          allOf:
          - $ref: '#/components/schemas/AutoupdateSettings'
        volume_mounts:
          type: array
          description: Volume mounts for the container
          items:
            oneOf:
            - $ref: '#/components/schemas/ScratchVolumeMountDto'
              description: Scratch volume mount
            - $ref: '#/components/schemas/SecretVolumeMountDto'
              description: Secret volume mount
            - $ref: '#/components/schemas/SharedVolumeMountDto'
              description: Shared filesystem volume mount
            - $ref: '#/components/schemas/MemoryVolumeMountDto'
              description: Memory volume mount
      required:
      - name
    ScratchVolumeMountDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the volume
          examples:
          - scratch
          enum:
          - scratch
        mount_path:
          type: string
          description: Path in the container where the volume will be mounted
          example: /data
      required:
      - type
      - mount_path
    ContainerDeploymentTemplatePublicApiDto:
      type: object
      properties:
        id:
          type: string
          description: Stable, URL-safe template identifier used in template paths
          example: qwen3-5-9b
        name:
          type: string
          description: Human-readable name of the model
          example: Qwen3.5 9B
        description:
          type: string
          description: Description of the model
          example: Dense multimodal model with gated delta networks hybrid attention and 262K context. Single-GPU serving.
        provider:
          type: string
          description: Provider of the model
          example: Qwen
        engine:
          type: string
          description: Serving engine used by the template
          example: vllm
        model_repository:
          type: string
          description: Hugging Face repository the default variant loads
          example: Qwen/Qwen3.5-9B
        parameters:
          type: string
          description: Parameter count of the model (display string)
          example: 9B
        context_length:
          type: number
          description: Maximum context length in tokens
          example: 262144
        input_modalities:
          description: Accepted input modalities
          example:
          - text
          - image
          type: array
          items:
            type: string
        output_modalities:
          description: Produced output modalities
          example:
          - text
          type: array
          items:
            type: string
        tasks:
          description: Coarse task labels
          example:
          - text
          - multimodal
          type: array
          items:
            type: string
        requires_hugging_face_token:
          type: boolean
          description: Whether a Hugging Face token is required to deploy the model (gated checkpoint)
          example: false
        min_vram_gb:
          type: number
          description: Minimum total GPU memory in GB for the default variant
          example: 22
        recommended_compute:
          description: Smallest compute configuration currently offered that fits the default variant. Null when nothing offered fits
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ComputeResource'
      required:
      - id
      - name
      - description
      - provider
      - engine
      - model_repository
      - parameters
      - context_length
      - input_modalities
      - output_modalities
      - tasks
      - requires_hugging_face_token
      - min_vram_gb
      - recommended_compute
    ReplicaInfo:
      type: object
      properties:
        id:
          type: string
          description: Replica ID
          example: v4cb4
        status:
          type: string
          description: Replica status
          example: running
          enum:
          - unavailable
          - initializing
          - running
          - terminating
          - error
          - imagepulling
        started_at:
          type: string
          description: Time when the replica was started, ISO 8601 string format
          example: '2021-06-14T12:00:00Z'
        image:
          type: string
          description: Full container image reference
          example: docker.io/library/nginx:1.21
        image_name:
          type: string
          description: Container image name
          example: nginx
        image_tag:
          type: string
          description: Container image tag
          example: '1.21'
      required:
      - id
      - status
      - started_at
    PatchScalingOptionsPublicApiDto:
      type: object
      properties:
        min_replica_count:
          type: number
          description: Minimum number of replicas
          example: 1
        max_replica_count:
          type: number
          description: Maximum number of replicas
          example: 50
        scale_down_policy:
          description: Policy for scaling down replicas
          example:
            delay_seconds: 300
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        scale_up_policy:
          description: Policy for scaling up replicas
          example:
            delay_seconds: 300
          allOf:
          - $ref: '#/components/schemas/ScalingPolicy'
        queue_message_ttl_seconds:
          type: number
          description: Duration in seconds after which messages in the queue will be dropped
          example: 500
        concurrent_requests_per_replica:
          type: number
          description: Number of requests each replica can process concurrently.
          example: 1
        scaling_triggers:
          description: Triggers for scaling up and down
          allOf:
          - $ref: '#/components/schemas/PatchScalingTriggers'
    GetSecretsPublicApiResponseDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the secret
