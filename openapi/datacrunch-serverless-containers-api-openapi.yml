      tags:
      - Serverless Containers
  /v1/container-deployment-templates/{template_id}:
    get:
      operationId: ContainerDeploymentTemplatesPublicApiController_getTemplate
      parameters:
      - name: template_id
        required: true
        in: path
        description: Id of the template
        schema:
          example: qwen3-5-9b
          type: string
      responses:
        '200':
          description: The template with its variants and features
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDeploymentTemplateDetailPublicApiDto'
        '401':
