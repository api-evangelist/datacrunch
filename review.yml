sources:
  - url: https://api.datacrunch.io/v1/docs
    type: APIReference
    note: Interactive OpenAPI/Swagger reference for the Public API; all endpoints are HTTPS REST.
  - url: https://docs.datacrunch.io/
    type: Documentation
    note: Resources overview describes OAuth2 client-credentials auth and the REST resource groups.
  - url: https://docs.datacrunch.io/containers/overview
    type: Documentation
    note: Serverless Containers tagged under the same Public API; OpenAI-compatible inference via deployed model servers (vLLM/TGI/SGLang).
  - url: https://docs.datacrunch.io/containers/scaling
    type: Documentation
    note: Autoscaling by queue load, CPU, and GPU utilization with min/max replicas; no WebSocket control plane.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and no DataCrunch-published SSE API
    surface is documented (inference streaming is a property of user-deployed
    OpenAI-compatible containers). Therefore no AsyncAPI document was authored;
    the catalog models the documented REST Public API only.
